<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sample Plugin Dashboard</title>
  <style>
    body { font-family: sans-serif; padding: 16px; color: #e2e8f0; background: #0f1720; }
    h2 { margin-top: 0; }
    pre { background: #1e293b; padding: 10px; border-radius: 6px; overflow: auto; }
    button { padding: 8px 12px; margin-right: 8px; margin-top: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Sample Plugin Dashboard</h2>
  <pre id="state">Laden...</pre>
  <button onclick="increment()">+1 (Fire-and-Forget)</button>
  <button onclick="askName()">Dialog (prompt)</button>
  <button onclick="save()">Secret + Storage speichern</button>

  <script>
    function render(data) {
      document.getElementById('state').textContent = JSON.stringify(data, null, 2);
    }

    async function refresh() {
      render(await window.sshCentral.invoke('getState', {}));
    }

    function increment() {
      window.sshCentral.send('increment', {});
      setTimeout(refresh, 150);
    }

    async function askName() {
      const name = await window.sshCentral.invoke('askName', {});
      render({ dialogResult: name });
    }

    async function save() {
      await window.sshCentral.invoke('saveSecret', { token: 'demo-token', note: 'Demo-Notiz' });
      await refresh();
    }

    // Push vom Main-Plugin empfangen (alle 5s).
    window.sshCentral.on('tick', function (payload) {
      console.log('tick', payload);
    });

    refresh();
  </script>
</body>
</html>
