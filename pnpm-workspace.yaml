packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"

# Transitive Abhaengigkeiten auf gepatchte Versionen erzwingen (Security).
# kdbxweb pinnt @xmldom/xmldom 0.7.x (5 High-Findings); 0.8.13+ ist patched.
overrides:
  '@xmldom/xmldom': '>=0.8.13'

# Native/Optimizer-Build-Skripte, die pnpm ausfuehren darf (pnpm v11 `allowBuilds`).
# - ssh2 / cpu-features: optionale native Beschleunigung fuer SSH
# - esbuild: Binary-Setup fuer Vite/electron-vite
# - electron-winstaller: NSIS-Installer fuer Windows (electron-builder)
allowBuilds:
  cpu-features: true
  electron: true
  electron-winstaller: true
  esbuild: true
  ssh2: true
