name: build

on:
  push:
    branches: [develop, main]
    # Tags vX.Y.Z: bauen die Installer UND legen die GitHub-Release mit Artifacts an.
    tags: ['v*']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

env:
  CI: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm-Version kommt aus package.json ("packageManager": "pnpm@11.17.0") -
      # keine explizite "version" angeben, sonst "Multiple versions of pnpm specified".
      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (inkl. Coverage-Thresholds)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  # Paketiert bei JEDEM Push (develop/main) und laedt die Installer als Artifacts hoch.
  # (Bei Pull Requests nur Checks, um schwere Packaging-Runs zu vermeiden.)
  package:
    if: github.event_name == 'push'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm-Version kommt aus package.json ("packageManager": "pnpm@11.17.0") -
      # keine explizite "version" angeben, sonst "Multiple versions of pnpm specified".
      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package
        run: pnpm package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssh-central-${{ matrix.os }}
          # Nur die Installer (Top-Level) - NICHT die internen Helfer aus win-unpacked/
          # (elevate.exe, pagent.exe, SSH-Central.exe), damit die Release sauber bleibt.
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: warn

  # Bei einem Tag-Push (vX.Y.Z): sammelt die Installer aus den package-Jobs und legt
  # die GitHub-Release mit den Artifacts an. Läuft nach `package` (buildet die Installer).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          name: ${{ github.ref_name }}
          generate_release_notes: true
