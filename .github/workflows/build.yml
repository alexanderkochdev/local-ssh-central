name: build

on:
  push:
    branches: [develop, main]
    # Tags vX.Y.Z: bauen die Installer UND legen die GitHub-Release mit Artifacts an.
    tags: ['v*']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

env:
  CI: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm-Version kommt aus package.json ("packageManager": "pnpm@11.17.0") -
      # keine explizite "version" angeben, sonst "Multiple versions of pnpm specified".
      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        run: pnpm typecheck

      - name: Lint
        id: lint
        run: pnpm lint

      - name: Test (inkl. Coverage-Thresholds)
        id: test
        run: pnpm test:coverage

      - name: Build
        id: package-build
        run: pnpm build

      # Coverage-Berichte aufheben (HTML + json-summary je Paket), damit ein
      # fehlgeschlagener Threshold ohne lokalen Re-Run nachvollziehbar ist.
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: |
            apps/*/coverage/**
            packages/*/coverage/**
          if-no-files-found: ignore
          retention-days: 7

      # Sagt im Job-Summary konkret, WELCHER Check gescheitert ist - sonst sieht man
      # in der PR-Ansicht nur ein rotes "build (os)".
      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Check fehlgeschlagen (${{ matrix.os }})"
            echo ""
            echo "| Schritt | Ergebnis |"
            echo "| --- | --- |"
            echo "| Typecheck | ${{ steps.typecheck.outcome || 'skipped' }} |"
            echo "| Lint | ${{ steps.lint.outcome || 'skipped' }} |"
            echo "| Test + Coverage | ${{ steps.test.outcome || 'skipped' }} |"
            echo "| Build | ${{ steps.package-build.outcome || 'skipped' }} |"
            echo ""
            echo "Lokal reproduzieren:"
            echo '```bash'
            echo 'pnpm install --frozen-lockfile'
            echo 'pnpm typecheck && pnpm lint && pnpm test:coverage && pnpm build'
            echo '```'
            echo ""
            echo "Bei Coverage-Fehlern: Artifact \`coverage-${{ matrix.os }}\` herunterladen."
          } >> "$GITHUB_STEP_SUMMARY"

  # Paketiert bei JEDEM Push (develop/main) und laedt die Installer als Artifacts hoch.
  # (Bei Pull Requests nur Checks, um schwere Packaging-Runs zu vermeiden.)
  package:
    if: github.event_name == 'push'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm-Version kommt aus package.json ("packageManager": "pnpm@11.17.0") -
      # keine explizite "version" angeben, sonst "Multiple versions of pnpm specified".
      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # `--publish never` (siehe package-Skript): Hochladen macht ausschliesslich der
      # release-Job, damit Pushes auf develop keine Release-Assets veraendern.
      - name: Package
        run: pnpm package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssh-central-${{ matrix.os }}
          # electron-builder schreibt nach `release/<version>/` (directories.output).
          # Nur die Top-Level-Dateien dieses Ordners nehmen - NICHT die internen Helfer
          # aus win-unpacked/ (elevate.exe, pagent.exe), damit die Release sauber bleibt.
          # latest*.yml + *.blockmap sind Pflicht: electron-updater liest daraus die
          # verfuegbare Version und den Delta-Download.
          path: |
            apps/desktop/release/*/*.exe
            apps/desktop/release/*/*.AppImage
            apps/desktop/release/*/*.deb
            apps/desktop/release/*/*.blockmap
            apps/desktop/release/*/latest*.yml
          if-no-files-found: error

  # Bei einem Tag-Push (vX.Y.Z): sammelt die Installer aus den package-Jobs und legt
  # die GitHub-Release mit den Artifacts an. Läuft nach `package` (buildet die Installer).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Nur die Installer-Artifacts - die Coverage-Berichte gehoeren nicht in die Release.
          pattern: ssh-central-*
          merge-multiple: true

      - name: List release assets
        run: ls -la artifacts

      # Die Assets enthalten bewusst auch latest*.yml und *.blockmap: ohne diese Metadaten
      # findet electron-updater in den installierten Apps kein Update.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          name: ${{ github.ref_name }}
          generate_release_notes: true
