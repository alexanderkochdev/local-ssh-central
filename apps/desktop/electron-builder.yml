appId: dev.alexanderkoch.sshcentral
productName: SSH Central
# Explizite, dateisystem-sichere Executable-Name. Ohne diesen wird sie aus dem
# Paketnamen abgeleitet ("@ssh-central/desktop" -> "@ssh-centraldesktop", ungueltig).
executableName: SSH-Central
copyright: Copyright (c) 2026 Alexander Koch
directories:
  # Versions-spezifischer Output-Ordner (release/<version>/): jeder Release baut in einen
  # frischen Ordner und kann nie gegen ein altes (moeglicherweise gelocktes) win-unpacked
  # laufen (vermeidet EBUSY/resource-busy beim erneuten Packen).
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  category: Network
  maintainer: Alexander Koch <https://www.alexanderkoch.dev/>
  synopsis: Fast, secure SSH client and SFTP file manager
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
