appId: dev.alexanderkoch.sshcentral
productName: SSH Central
# Explizite, dateisystem-sichere Executable-Name. Ohne diesen wird sie aus dem
# Paketnamen abgeleitet ("@ssh-central/desktop" -> "@ssh-centraldesktop", ungueltig).
executableName: SSH-Central
copyright: Copyright (c) 2026 Alexander Koch
directories:
  # Versions-spezifischer Output-Ordner (release/<version>/): jeder Release baut in einen
  # frischen Ordner und kann nie gegen ein altes (moeglicherweise gelocktes) win-unpacked
  # laufen (vermeidet EBUSY/resource-busy beim erneuten Packen).
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# Update-Quelle fuer electron-updater. Erzeugt beim Packen zusaetzlich die Metadaten
# (latest.yml / latest-linux.yml + .blockmap), die die App zum Selbst-Update braucht.
# Das eigentliche Hochladen macht der release-Job der CI (Packen laeuft mit --publish never).
publish:
  provider: github
  owner: alexanderkochdev
  repo: ssh-central
  releaseType: release
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # Bewusst OHNE ${productName}: "SSH Central" enthaelt ein Leerzeichen. GitHub ersetzt
  # Leerzeichen in Asset-Namen durch Punkte, electron-builder schreibt in latest.yml aber
  # Bindestriche - der Updater wuerde die Datei mit 404 nicht finden. Ein leerzeichenfreier
  # Name haelt Datei, latest.yml und GitHub-Asset identisch.
  artifactName: SSH-Central-${version}-${os}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  category: Network
  maintainer: Alexander Koch <https://www.alexanderkoch.dev/>
  synopsis: Fast, secure SSH client and SFTP file manager
  # Ebenfalls leerzeichenfrei (siehe win.artifactName) - das AppImage-Update laeuft
  # ueber denselben Namensabgleich in latest-linux.yml.
  artifactName: SSH-Central-${version}-${os}-${arch}.${ext}
